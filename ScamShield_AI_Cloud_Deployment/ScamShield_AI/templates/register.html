{% extends "base.html" %}{% block title %}Create account | ScamShield AI{% endblock %}
{% block content %}
<section class="panel narrow"><h2>Create your account</h2>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label><input id="username" name="username" value="{{ username }}" required minlength="3" maxlength="30" autocomplete="username">
  <label for="email">Email</label><input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email">
  <label for="password">Password (min 8 characters)</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
  <button type="submit" class="full">Create account</button>
</form>
<p class="muted center">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></section>
{% endblock %}
